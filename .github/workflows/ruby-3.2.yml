name: RSpec EOL Ruby 3.2

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches:
      - 'main'
    tags:
      - '!*' # Do not execute on tags
  pull_request:
    branches:
      - '*'
  # Allow manually triggering the workflow.
  workflow_dispatch:

env:
  RUSTFLAGS: "-W warnings"

jobs:
  test:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2']
        experimental: [false]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # Use ts-grammar-action for tree-sitter library, CLI, and toolchain setup
      # Sets up Rust for tree_stump compilation
      - name: Set up tree-sitter environment
        uses: kettle-rb/ts-grammar-action@v1
        with:
          install-cli: true
          install-lib: true
          # Rust is required for tree_stump gem compilation
          setup-rust: true

      - name: Verify Rust installation
        run: |
          rustc --version
          cargo --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this to invalidate cache if needed
          rubygems: '4.0.6'
          bundler: '4.0.6'

      - name: Build tree-sitter-ruby grammar
        run: |
          cd tree-sitter-ruby
          make
          ls -la *.so || ls -la *.dylib || echo "Warning: No shared library found after make"

      - name: List files
        run: ls && ls tree-sitter-ruby

      - name: Compile extension
        run: bundle exec rake compile

      - name: Verify extension was built
        run: |
          if [ -f lib/tree_stump/tree_stump.so ]; then
            echo "✓ Extension successfully built: lib/tree_stump/tree_stump.so"
            ls -lh lib/tree_stump/tree_stump.so
          else
            echo "✗ Extension not found at lib/tree_stump/tree_stump.so"
            echo "Searching for extension files..."
            find . -name "*.so" -o -name "libtree_stump.*"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake spec
